services:
  neo4j:
    image: neo4j:5.26-community
    container_name: iex-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_max__size: 2G
    ports:
      - "7474:7474"   # Neo4j Browser (optional, for graph inspection/debugging)
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    # image: lets you skip building entirely -- `docker compose pull backend`
    # fetches this pre-built image from GHCR (built by .github/workflows/
    # docker-build.yml on every push), then `docker compose up -d` runs it
    # without ever invoking `build:` locally. Only falls back to a local
    # build if you explicitly run `docker compose up --build`.
    # pull_policy: always -- without this, `docker compose pull` skips any
    # service that also has a `build:` section ("Skipped - Image is already
    # being built"), assuming you intend to build it yourself.
    image: ghcr.io/ankitsingh1323-web/intelligence-extraction-system-backend:latest
    pull_policy: always
    build:
      context: ./backend
      args:
        EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-large-en-v1.5}
    container_name: iex-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    # A host bind mount, not a Docker-managed named volume -- this is where
    # every job's uploads/outputs, the persistent dataset library, and OBS
    # settings (credentials + encryption key) live. A bind mount is visible
    # as a real ./data folder next to this file (easy to back up/inspect
    # from the host) and, unlike a named volume, is never deleted by
    # `docker compose down -v` -- only deleting the folder itself removes
    # it. See README's "Data persistence" section before migrating from an
    # existing named-volume setup, or old data will appear to vanish (it's
    # still in the old volume, just not mounted anymore).
    volumes:
      - ./data:/app/data

  frontend:
    image: ghcr.io/ankitsingh1323-web/intelligence-extraction-system-frontend:latest
    pull_policy: always
    build:
      context: ./frontend
    container_name: iex-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
